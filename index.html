<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BwithU — Your AI companion, always with you</title>
    <meta name="description" content="BwithU is a warm voice companion that lives in your Chrome side panel. Talk out loud, ask about your open tabs, search the web, and get things done. Free in beta, no account or API keys." />
    <link rel="canonical" href="https://bwithu.ai/" />
    <meta name="theme-color" content="#060816" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BwithU" />
    <meta property="og:url" content="https://bwithu.ai/" />
    <meta property="og:title" content="BwithU — Your AI companion, always with you" />
    <meta property="og:description" content="A warm voice companion in your Chrome side panel. Talk, ask about your tabs, look things up." />
    <meta property="og:image" content="https://bwithu.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BwithUAI" />
    <meta name="twitter:title" content="BwithU — Your AI companion, always with you" />
    <meta name="twitter:description" content="A warm voice companion in your Chrome side panel. Talk, ask about your tabs, look things up." />
    <meta name="twitter:image" content="https://bwithu.ai/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preload" href="/fonts/jersey-10-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BwithU",
        "applicationCategory": "BrowserApplication",
        "operatingSystem": "Chrome",
        "description": "A warm voice companion that lives in your Chrome side panel. Talk out loud, ask about your open tabs, search the web, and get small things done.",
        "url": "https://bwithu.ai/",
        "image": "https://bwithu.ai/og.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Keep in sync with src/sections/FAQ.tsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "Is BwithU free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. During the beta it's free, with friendly daily limits so it stays fast for everyone. Live voice calls run up to 10 minutes each." } },
          { "@type": "Question", "name": "Do I need an API key or an account?", "acceptedAnswer": { "@type": "Answer", "text": "No. Install it, pick a companion, and start talking. There's nothing to sign up for and no keys to paste." } },
          { "@type": "Question", "name": "Is B listening all the time?", "acceptedAnswer": { "@type": "Answer", "text": "No. B only hears you while the mic is on, and you turn it on yourself. Your audio is never recorded or stored." } },
          { "@type": "Question", "name": "What can B see on my screen?", "acceptedAnswer": { "@type": "Answer", "text": "When you talk to B, it reads the title, address and visible text of your open tabs (up to 12) so it can answer questions about them. It doesn't look at pages when you're not using it." } },
          { "@type": "Question", "name": "Can B control my browser?", "acceptedAnswer": { "@type": "Answer", "text": "A little, and only with your OK. B can open a site, switch to a tab, run a search, or draft a Google Calendar invite for you to review. It asks before doing any of these." } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BwithU is a warm voice companion for your Chrome side panel. Please enable JavaScript to see the site.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  <head>
    <meta charset="UTF-8" />

    <title>BwithU — An AI companion you can video-call</title>
    <meta name="description" content="BwithU is a warm AI companion you can video-call in your browser. Pick a face and a voice, give them a name, and just talk. No app, no sign-up, 10 free minutes a day." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BwithU" />
    <meta property="og:url" content="https://bwithu.live/" />
    <meta property="og:title" content="BwithU — Someone to talk to. Face to face." />
    <meta property="og:description" content="A warm AI companion you can video-call in your browser. No app, no sign-up." />
    <meta property="og:image" content="https://bwithu.live/og.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BwithUAI" />
    <meta name="twitter:title" content="BwithU — Someone to talk to. Face to face." />
    <meta name="twitter:description" content="A warm AI companion you can video-call in your browser. No app, no sign-up." />
    <meta name="twitter:image" content="https://bwithu.live/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/faces/maya-idle.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BwithU",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Chrome, Safari or Edge with a microphone",
        "description": "A warm AI companion you can video-call in your browser. Pick a face and a voice, give them a name, and just talk.",
        "url": "https://bwithu.live/",
        "image": "https://bwithu.live/og.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Keep in sync with src/sections/FAQ.tsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "Is BwithU free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Everyone gets 10 free minutes a day, and a single call can run up to 10 minutes. No card, no trial." } },
          { "@type": "Question", "name": "Do I need to download an app or make an account?", "acceptedAnswer": { "@type": "Answer", "text": "No. Open app.bwithu.live in your browser, pick a companion and start talking. There's nothing to install or sign up for." } },
          { "@type": "Question", "name": "Is it a real person?", "acceptedAnswer": { "@type": "Answer", "text": "No. Your companion is an AI with a lifelike face and voice. It will always tell you it's an AI if you ask." } },
          { "@type": "Question", "name": "Are my calls recorded?", "acceptedAnswer": { "@type": "Answer", "text": "No. Your voice is sent to our AI providers to understand you and reply in real time, and then it's gone. We don't store audio or transcripts." } },
          { "@type": "Question", "name": "Which devices work?", "acceptedAnswer": { "@type": "Answer", "text": "Chrome, Safari and Edge on phones, tablets and computers. Headphones give the smoothest conversation, so your companion doesn't hear itself." } },
          { "@type": "Question", "name": "What languages can I speak?", "acceptedAnswer": { "@type": "Answer", "text": "English works best today. Your companion understands many languages and tries to reply in the one you speak." } },
          { "@type": "Question", "name": "Can I make a companion from my own photo?", "acceptedAnswer": { "@type": "Answer", "text": "Soon. Join the list and we'll email you when it's ready. Custom companions will be private to you." } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BwithU is a warm AI companion you can video-call at https://app.bwithu.live. Please enable JavaScript to see this site.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
